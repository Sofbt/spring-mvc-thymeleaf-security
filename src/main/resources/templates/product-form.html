<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment réutilisé par new-product.html et edit-product.html -->
<form th:fragment="form" method="post" th:action="@{/admin/saveProduct}" th:object="${product}" novalidate>
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label class="form-label" for="name">Nom</label>
        <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="price">Prix</label>
        <input type="number" step="0.01" class="form-control" th:field="*{price}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{price}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="quantity">Quantité</label>
        <input type="number" class="form-control" th:field="*{quantity}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{quantity}"></div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
    <a th:href="@{/user/index}" class="btn btn-outline-secondary">Annuler</a>
</form>
</body>
</html>
